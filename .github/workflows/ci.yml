name: CI

# Builds and tests every pull request and every push to main, with the release build's commands and pins
# (w-build.yml), plus the web tests. Read-only token, no secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: "Build and test"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: '10.0.x'

    # Node 22 and npm 11.11.0, as in the release build: the lock file only validates under npm 11.
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: src/Beacon.UI/web/package-lock.json

    - name: Pin npm
      run: |
        npm install -g npm@11.11.0
        echo "node $(node --version) / npm $(npm --version)"

    - name: Web tests
      working-directory: src/Beacon.UI/web
      run: npm ci && npm test

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore --property WarningLevel=0

    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal
