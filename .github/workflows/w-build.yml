name: Build the Beacon Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build:
    name: "Build and Publish Beacon"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # required: lets NuGet/login exchange a GitHub OIDC token for a NuGet API key

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Beacon.UI shells out to `npm ci` during a Release build. Without this the runner's default
    # Node is used, which floats: Node 24's npm rejected a package-lock.json that Node 22's npm
    # accepts, failing the build on missing @esbuild/* optional platform entries. Pin it so CI
    # resolves the lock the same way local development does — bump this and the lock together.
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: src/Beacon.UI/web/package-lock.json

    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore --property WarningLevel=0

    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Pack packable projects
      run: |
        set -euo pipefail
        VERSION="${{ steps.version.outputs.version }}"
        echo "Packing version: $VERSION"

        # Get projects from the solution (.slnx) — only projects in the solution are processed
        SOLUTION_PROJECTS=$(dotnet sln Beacon.slnx list | grep '\.csproj$')

        echo "Projects in solution:"
        echo "$SOLUTION_PROJECTS"

        # Filter to only packable projects
        PACKABLE_PROJECTS=""
        for PROJECT in $SOLUTION_PROJECTS; do
          if [ -f "$PROJECT" ] && grep -q "<IsPackable>true</IsPackable>" "$PROJECT"; then
            PACKABLE_PROJECTS="$PACKABLE_PROJECTS $PROJECT"
          fi
        done

        echo "Packable projects:"
        echo "$PACKABLE_PROJECTS"

        # Pack every project into one shared artifacts dir. Package filenames are NOT derivable
        # from the project name: the ID is Moberg.$(MSBuildProjectName) (see Directory.Build.props)
        # and NuGet normalizes versions (a 4-part tag like 3.7.0.0 packs as 3.7.0), so the push
        # step globs this directory rather than reconstructing names.
        for PROJECT in $PACKABLE_PROJECTS; do
          echo "Packing: $PROJECT"
          dotnet pack "$PROJECT" \
            -p:PackageVersion="$VERSION" \
            --configuration Release \
            --no-build \
            --output artifacts
        done

        COUNT=$(find artifacts -maxdepth 1 -name '*.nupkg' | wc -l)
        if [ "$COUNT" -eq 0 ]; then
          echo "Error: no packages were produced."
          exit 1
        fi
        echo "Packed $COUNT package(s):"
        ls -1 artifacts/*.nupkg

    # Trusted Publishing: no long-lived NUGET_API_KEY secret. GitHub issues an OIDC token,
    # nuget.org validates it against the trusted-publishing policy for this repo + workflow file
    # and returns a temporary key. That key is valid for ONE HOUR, so this step deliberately sits
    # after the slow build/test/pack steps and immediately before the push.
    - name: NuGet login (OIDC -> short-lived API key)
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push packages
      run: |
        set -euo pipefail
        for PACKAGE in artifacts/*.nupkg; do
          echo "Pushing: $PACKAGE"
          dotnet nuget push "$PACKAGE" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
        done