name: Build the Beacon Release

# Two jobs. `build` has a read-only token: it checks the version and that the commit is on main, then builds, tests and
# packs. `publish` waits for approval in the `nuget-release` environment and is the only job that can request an OIDC
# token, which NuGet/login exchanges for a short-lived nuget.org key; it never checks out or runs repository code.
# The nuget.org trusted-publishing policy names this file: keep its name.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 4.5.0.4). Dispatch from main only.'
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: "Build and pack Beacon"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    # Full history: the release commit must be an ancestor of origin/main.
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
        persist-credentials: false

    # Inputs reach the script through env, never through template expansion. A release publishes from a tag on main, a
    # manual run from main itself, and the version is a release version (1.2.3, 1.2.3.4 or 1.2.3-rc.1).
    - name: Check the version and the ref
      id: version
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_VERSION: ${{ inputs.version }}
        GIT_REF: ${{ github.ref }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          if [ "$GIT_REF" != "refs/heads/main" ]; then
            echo "::error::Run the release from main."
            exit 1
          fi
          VERSION="$INPUT_VERSION"
        elif [ "$EVENT_NAME" = "release" ] && [ "$REF_TYPE" = "tag" ]; then
          VERSION="$REF_NAME"
        else
          echo "::error::A release publishes from a release tag or a manual run on main."
          exit 1
        fi

        if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){2,3}(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::The version is not a release version (1.2.3, 1.2.3.4 or 1.2.3-rc.1)."
          exit 1
        fi

        if ! git merge-base --is-ancestor HEAD origin/main; then
          echo "::error::The commit to release is not on main."
          exit 1
        fi

        echo "Version: $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: '10.0.x'

    # Beacon.UI shells out to `npm ci` during a Release build. Without this the runner's default
    # Node is used, which floats: Node 24's npm rejected a package-lock.json that Node 22's npm
    # accepts, failing the build on missing @esbuild/* optional platform entries. Pin it so CI
    # resolves the lock the same way local development does — bump this and the lock together.
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: src/Beacon.UI/web/package-lock.json

    # package-lock.json was generated by npm 11 and only validates under npm 11. The npm bundled
    # with Node 22 rejects it, claiming the @esbuild/* optional platform entries are missing even
    # though they are present at 0.21.5 — the two majors disagree about how vitest 4's esbuild
    # requirement should be recorded. A clean-room `npm ci` against this exact lock succeeds on
    # npm 11.11.0, so pin it rather than leaving the bundled version to drift with the Node patch
    # (CI resolved 22.23.2 where local had 22.14.0). Regenerate the lock if this pin ever moves.
    - name: Pin npm
      run: |
        npm install -g npm@11.11.0
        echo "node $(node --version) / npm $(npm --version)"

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore --property WarningLevel=0

    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Pack packable projects
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        echo "Packing version: $VERSION"

        # Get projects from the solution (.slnx) — only projects in the solution are processed
        SOLUTION_PROJECTS=$(dotnet sln Beacon.slnx list | grep '\.csproj$')

        echo "Projects in solution:"
        echo "$SOLUTION_PROJECTS"

        # Filter to only packable projects
        PACKABLE_PROJECTS=""
        for PROJECT in $SOLUTION_PROJECTS; do
          if [ -f "$PROJECT" ] && grep -q "<IsPackable>true</IsPackable>" "$PROJECT"; then
            PACKABLE_PROJECTS="$PACKABLE_PROJECTS $PROJECT"
          fi
        done

        echo "Packable projects:"
        echo "$PACKABLE_PROJECTS"

        # Pack every project into one shared artifacts dir. Package filenames are NOT derivable
        # from the project name: the ID is Moberg.$(MSBuildProjectName) (see Directory.Build.props)
        # and NuGet normalizes versions (a 4-part tag like 3.7.0.0 packs as 3.7.0), so the push
        # step globs this directory rather than reconstructing names.
        for PROJECT in $PACKABLE_PROJECTS; do
          echo "Packing: $PROJECT"
          # No --no-build: the SDK gates ResolveProjectStaticWebAssets on NoBuild != true, so a
          # no-build pack silently skips static web asset discovery. Beacon.UI's React bundle then
          # shipped under content/ + contentFiles/ instead of staticwebassets/ — the
          # packages.config-era layout, which SDK-style PackageReference consumers never copy, so
          # the UI 404'd for every consumer while the sample project (ProjectReference) worked.
          # The Build step above already ran; this re-run is incremental.
          dotnet pack "$PROJECT" \
            -p:PackageVersion="$VERSION" \
            --configuration Release \
            --output artifacts
        done

        COUNT=$(find artifacts -maxdepth 1 -name '*.nupkg' | wc -l)
        if [ "$COUNT" -eq 0 ]; then
          echo "Error: no packages were produced."
          exit 1
        fi
        echo "Packed $COUNT package(s):"
        ls -1 artifacts/*.nupkg

    - name: Upload packages
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: packages
        path: artifacts/*.nupkg
        if-no-files-found: error
        retention-days: 7

  publish:
    name: "Publish Beacon to nuget.org"
    needs: build
    runs-on: ubuntu-latest

    # Required reviewers and deployment rules live on this environment (repository settings).
    environment: nuget-release

    permissions:
      id-token: write   # the only job that can request an OIDC token: NuGet/login exchanges it for a nuget.org key

    steps:
    - name: Download packages
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: packages
        path: artifacts

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: '10.0.x'

    # Trusted Publishing: no long-lived NUGET_API_KEY secret. GitHub issues an OIDC token,
    # nuget.org validates it against the trusted-publishing policy for this repo + workflow file
    # and returns a temporary key. That key is valid for ONE HOUR, so this job logs in only after
    # the build job and the environment approval, immediately before the push.
    - name: NuGet login (OIDC -> short-lived API key)
      id: login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push packages
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        set -euo pipefail
        for PACKAGE in artifacts/*.nupkg; do
          echo "Pushing: $PACKAGE"
          dotnet nuget push "$PACKAGE" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
        done
